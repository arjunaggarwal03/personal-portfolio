name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 14 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Content, types, lint, format, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:fast

  browser:
    name: Production browser and accessibility
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: next-production-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  performance:
    name: Lighthouse and resource budgets
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-production-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - if: github.event_name == 'pull_request'
        run: npm run test:perf
      - if: github.event_name != 'pull_request'
        run: npm run test:perf:full

  maintenance:
    name: Dependency and bundle audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run knip
      - run: npm run analyze
      - run: npm run links:external
      - uses: actions/upload-artifact@v4
        with:
          name: next-bundle-analysis
          path: .next/diagnostics/analyze
          include-hidden-files: true
          retention-days: 14
